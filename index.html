<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trip Expenses">
<meta name="theme-color" content="#4c7a6f">
<style>
  :root {
    --bg: #faf8f5;
    --card: #ffffff;
    --text: #1f2320;
    --muted: #6b6f6c;
    --accent: #c0603e;
    --accent-2: #4c7a6f;
    --border: #e6e1da;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a;
      --card: #212327;
      --text: #ecebe8;
      --muted: #9a9d99;
      --border: #33353a;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body {
    max-width: 640px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }
  h1 { font-size: 1.4rem; margin: 4px 0 18px; }
  .subtitle { color: var(--muted); font-size: 0.85rem; margin-bottom: 18px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
    overflow: hidden;
  }
  label {
    display: block;
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 4px;
    margin-top: 12px;
  }
  label:first-of-type { margin-top: 0; }

  /* Uniform sizing for every text input, select, and date field */
  input, select {
    width: 100%;
    min-width: 0;
    box-sizing: border-box;
    height: 46px;
    padding: 0 12px;
    font-size: 1rem;
    line-height: 44px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    -webkit-appearance: none;
    appearance: none;
    font-family: inherit;
  }
  select {
    background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236b6f6c' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 12px center;
    background-size: 16px;
    padding-right: 34px;
  }
  input[type="date"] {
    -webkit-appearance: none;
    appearance: none;
  }
  .row { display: flex; gap: 10px; margin-top: 12px; }
  .row > div { flex: 1; min-width: 0; }

  button {
    margin-top: 16px;
    width: 100%;
    padding: 13px;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: white;
    cursor: pointer;
  }
  button:active { opacity: 0.85; }

  .totals { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
  .totals .big { font-size: 1.7rem; font-weight: 700; color: var(--accent-2); }
  .by-category { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
  .pill {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 12px;
    font-size: 0.8rem;
    color: var(--muted);
  }
  .pill b { color: var(--text); }

  /* City filter chips — deliberately small/secondary, not a CTA */
  .filter-row {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    margin-bottom: 6px;
    scrollbar-width: none;      /* Firefox */
    -ms-overflow-style: none;   /* old Edge/IE */
  }
  .filter-row::-webkit-scrollbar { display: none; } /* Chrome/Safari */
  button.filter-pill {
    width: auto;
    flex: none;
    margin-top: 0;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--muted);
    white-space: nowrap;
  }
  button.filter-pill.active {
    background: var(--accent-2);
    color: white;
    border-color: var(--accent-2);
  }

  .entry {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    gap: 10px;
  }
  .entry:last-child { border-bottom: none; }
  .entry-main { flex: 1 1 auto; min-width: 0; }
  .entry-desc {
    font-weight: 600;
    font-size: 0.95rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .entry-meta { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
  .entry-amount {
    font-weight: 700;
    white-space: nowrap;
    text-align: right;
    min-width: 84px;
    flex: none;
  }
  .entry-del {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 1.1rem;
    width: auto;
    margin: 0;
    padding: 4px 6px;
    cursor: pointer;
  }
  .day-header {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 18px 0 4px;
  }
  .empty { text-align: center; color: var(--muted); padding: 30px 10px; font-size: 0.9rem; }
  .status { font-size: 0.75rem; color: var(--muted); text-align: center; margin-top: 10px; }
  .who { display: flex; gap: 8px; margin-top: 12px; }
  .who button {
    margin-top: 0;
    flex: 1;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    font-weight: 500;
    padding: 9px;
    height: 44px;
  }
  .who button.active { background: var(--accent-2); color: white; border-color: var(--accent-2); }

  .tab-nav {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .tab-btn {
    width: auto;
    flex: 1;
    margin-top: 0;
    background: var(--card);
    color: var(--muted);
    border: 1px solid var(--border);
    font-weight: 600;
    padding: 10px;
  }
  .tab-btn.active {
    background: var(--accent-2);
    color: white;
    border-color: var(--accent-2);
  }
  .converter-big {
    font-size: 2rem;
    font-weight: 700;
    text-align: center;
    padding: 10px 0;
  }
  .converter-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .converter-row .curr-label {
    width: 56px;
    font-weight: 700;
    color: var(--muted);
    flex: none;
  }
  .converter-rate-note {
    text-align: center;
    color: var(--muted);
    font-size: 0.78rem;
    margin-top: 14px;
  }

  .entry-desc { cursor: pointer; }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 16px;
  }
  .modal-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 18px 16px 20px;
    width: 100%;
    max-width: 480px;
    max-height: 85vh;
    overflow-y: auto;
    box-sizing: border-box;
  }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 2px;
  }
  .modal-header h2 { font-size: 1.1rem; margin: 0; }
  .modal-close {
    width: auto;
    margin: 0;
    padding: 4px 8px;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 1.2rem;
    line-height: 1;
    cursor: pointer;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%) translateY(16px) scale(0.96);
    background: var(--accent-2);
    color: white;
    padding: 11px 20px;
    border-radius: 24px;
    font-weight: 600;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    gap: 8px;
    opacity: 0;
    pointer-events: none;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 2000;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0) scale(1);
  }
  .toast .toast-check {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }
  .toast .toast-check svg {
    width: 11px;
    height: 11px;
    stroke: white;
    stroke-width: 3;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 16;
    stroke-dashoffset: 16;
  }
  .toast.show .toast-check svg {
    animation: toastCheck 0.35s ease 0.1s forwards;
  }
  @keyframes toastCheck {
    to { stroke-dashoffset: 0; }
  }
</style>
</head>
<body>

  <h1>&#127991; Spain & Italy Expenses</h1>

  <div class="tab-nav">
    <button type="button" class="tab-btn active" id="tabTrackerBtn">Tracker</button>
    <button type="button" class="tab-btn" id="tabConverterBtn">Converter</button>
  </div>

  <div id="converterView" style="display:none">
    <div class="card">
      <label for="convEUR">Amount in EUR</label>
      <div class="converter-row">
        <span class="curr-label">&euro; EUR</span>
        <input id="convEUR" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00" />
      </div>
      <label for="convUSD">Amount in USD</label>
      <div class="converter-row">
        <span class="curr-label">$ USD</span>
        <input id="convUSD" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00" />
      </div>
      <div class="converter-rate-note">Using a rough rate of &euro;1 &asymp; $1.14</div>
    </div>
  </div>

  <div id="trackerView">

  <div class="card">
    <div class="totals">
      <div>
        <div style="font-size:0.78rem;color:var(--muted)">Total spent</div>
        <div class="big" id="totalUSD">$0.00</div>
      </div>
      <div>
        <div style="font-size:0.78rem;color:var(--muted)">&asymp; EUR</div>
        <div id="totalEUR" style="font-weight:600">&euro;0.00</div>
      </div>
    </div>
    <div class="by-category" id="byCategory"></div>
  </div>

  <div class="card">
    <label>Who's logging this?</label>
    <div class="who" id="whoButtons">
      <button type="button" data-who="H">H</button>
      <button type="button" data-who="Consu">Consu</button>
    </div>

    <label for="desc">Description</label>
    <input id="desc" type="text" placeholder="e.g. Dinner in Barrio G&oacute;tico" />

    <div class="row">
      <div>
        <label for="city">Location</label>
        <select id="city">
          <option>Pre-Trip</option>
          <option>Barcelona</option>
          <option>Florence</option>
          <option>Rome</option>
          <option>Madrid</option>
          <option>Post-Trip</option>
        </select>
      </div>
      <div>
        <label for="entryDate">Date</label>
        <input id="entryDate" type="date" />
      </div>
    </div>

    <div class="row">
      <div>
        <label for="category">Category</label>
        <select id="category">
          <option>Food & Drink</option>
          <option>Lodging</option>
          <option>Transport</option>
          <option>Flight</option>
          <option>Activities</option>
          <option>Tours</option>
          <option>Shopping</option>
          <option>Insurance</option>
          <option>Other</option>
        </select>
      </div>
      <div>
        <label for="currency">Currency</label>
        <select id="currency">
          <option value="EUR">EUR (&euro;)</option>
          <option value="USD">USD ($)</option>
        </select>
      </div>
    </div>

    <label for="amount">Amount</label>
    <input id="amount" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00" />

    <button id="addBtn" type="button">Add expense</button>
  </div>

  <div class="card" id="listCard">
    <div class="filter-row" id="cityFilterRow"></div>
    <div id="list"></div>
  </div>

  </div><!-- /trackerView -->

  <div class="modal-overlay" id="editOverlay" style="display:none">
    <div class="modal-card">
      <div class="modal-header">
        <h2>Edit expense</h2>
        <button type="button" class="modal-close" id="editCloseBtn" aria-label="Close">&#10005;</button>
      </div>

      <label>Who's logging this?</label>
      <div class="who" id="editWhoButtons">
        <button type="button" data-who="H">H</button>
        <button type="button" data-who="Consu">Consu</button>
      </div>

      <label for="editDesc">Description</label>
      <input id="editDesc" type="text" />

      <div class="row">
        <div>
          <label for="editCity">Location</label>
          <select id="editCity">
            <option>Pre-Trip</option>
            <option>Barcelona</option>
            <option>Florence</option>
            <option>Rome</option>
            <option>Madrid</option>
            <option>Post-Trip</option>
          </select>
        </div>
        <div>
          <label for="editDate">Date</label>
          <input id="editDate" type="date" />
        </div>
      </div>

      <div class="row">
        <div>
          <label for="editCategory">Category</label>
          <select id="editCategory">
            <option>Food & Drink</option>
            <option>Lodging</option>
            <option>Transport</option>
            <option>Flight</option>
            <option>Activities</option>
            <option>Tours</option>
            <option>Shopping</option>
            <option>Insurance</option>
            <option>Other</option>
          </select>
        </div>
        <div>
          <label for="editCurrency">Currency</label>
          <select id="editCurrency">
            <option value="EUR">EUR (&euro;)</option>
            <option value="USD">USD ($)</option>
          </select>
        </div>
      </div>

      <label for="editAmount">Amount</label>
      <input id="editAmount" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00" />

      <button id="applyEditBtn" type="button">Apply changes</button>
    </div>
  </div>

  <div class="status" id="status">Connecting&hellip;</div>

  <div class="toast" id="toast">
    <span class="toast-check"><svg viewBox="0 0 24 24"><polyline points="4,13 9,18 20,6"/></svg></span>
    <span id="toastMsg">Expense added</span>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import {
      getFirestore, collection, addDoc, deleteDoc, updateDoc, doc,
      onSnapshot, query, orderBy, limit
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDnpVJIvqM9Zlg5lD0r0q_OrwUF1_fLlRw",
      authDomain: "trip-expenses-84a37.firebaseapp.com",
      projectId: "trip-expenses-84a37",
      storageBucket: "trip-expenses-84a37.firebasestorage.app",
      messagingSenderId: "905831476267",
      appId: "1:905831476267:web:cef25ab52b5ac8abc3ce6e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const expensesCol = collection(db, "expenses");

    const listEl = document.getElementById('list');
    const totalUSDel = document.getElementById('totalUSD');
    const totalEURel = document.getElementById('totalEUR');
    const byCategoryEl = document.getElementById('byCategory');
    const statusEl = document.getElementById('status');
    const whoButtons = document.querySelectorAll('#whoButtons button');
    const cityFilterRow = document.getElementById('cityFilterRow');

    const EUR_TO_USD = 1.14;
    const CITIES = ['Pre-Trip', 'Barcelona', 'Florence', 'Rome', 'Madrid', 'Post-Trip'];

    let selectedWho = null;
    let selectedCityFilter = 'All';
    let latestEntries = [];

    document.getElementById('entryDate').value = new Date().toISOString().slice(0, 10);

    // Tab switching
    const tabTrackerBtn = document.getElementById('tabTrackerBtn');
    const tabConverterBtn = document.getElementById('tabConverterBtn');
    const trackerView = document.getElementById('trackerView');
    const converterView = document.getElementById('converterView');

    tabTrackerBtn.addEventListener('click', () => {
      tabTrackerBtn.classList.add('active');
      tabConverterBtn.classList.remove('active');
      trackerView.style.display = '';
      converterView.style.display = 'none';
    });
    tabConverterBtn.addEventListener('click', () => {
      tabConverterBtn.classList.add('active');
      tabTrackerBtn.classList.remove('active');
      converterView.style.display = '';
      trackerView.style.display = 'none';
    });

    // Live two-way EUR <-> USD converter
    const convEUR = document.getElementById('convEUR');
    const convUSD = document.getElementById('convUSD');
    convEUR.addEventListener('input', () => {
      const val = parseFloat(convEUR.value);
      convUSD.value = isNaN(val) ? '' : (val * EUR_TO_USD).toFixed(2);
    });
    convUSD.addEventListener('input', () => {
      const val = parseFloat(convUSD.value);
      convEUR.value = isNaN(val) ? '' : (val / EUR_TO_USD).toFixed(2);
    });

    whoButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        selectedWho = btn.dataset.who;
        whoButtons.forEach(b => b.classList.toggle('active', b === btn));
      });
    });

    // Pressing Enter dismisses the keyboard for that field instead of
    // jumping to the next one; Enter on amount submits the expense.
    document.getElementById('desc').addEventListener('keydown', (ev) => {
      if (ev.key !== 'Enter' && ev.keyCode !== 13) return;
      ev.preventDefault();
      ev.target.blur();
    });
    document.getElementById('entryDate').addEventListener('keydown', (ev) => {
      if (ev.key !== 'Enter' && ev.keyCode !== 13) return;
      ev.preventDefault();
      ev.target.blur();
    });
    document.getElementById('amount').addEventListener('keydown', (ev) => {
      if (ev.key !== 'Enter' && ev.keyCode !== 13) return;
      ev.preventDefault();
      ev.target.blur();
      document.getElementById('addBtn').click();
    });

    function toUSD(amount, currency) {
      if (currency === 'EUR') return amount * EUR_TO_USD;
      return amount;
    }

    function fmtMoney(n, cur) {
      const symbol = cur === 'USD' ? '$' : '\u20AC';
      const formatted = Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      return symbol + formatted;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function buildCityFilters() {
      cityFilterRow.innerHTML = '';
      const options = ['All', ...CITIES];
      options.forEach(city => {
        const pill = document.createElement('button');
        pill.type = 'button';
        pill.className = 'filter-pill' + (city === selectedCityFilter ? ' active' : '');
        pill.textContent = city;
        pill.addEventListener('click', () => {
          const beforeTop = cityFilterRow.getBoundingClientRect().top;
          selectedCityFilter = city;
          render(latestEntries);
          const afterTop = cityFilterRow.getBoundingClientRect().top;
          const delta = afterTop - beforeTop;
          if (delta !== 0) window.scrollBy(0, delta);
        });
        cityFilterRow.appendChild(pill);
      });
    }

    function render(entries) {
      latestEntries = entries;

      const filtered = selectedCityFilter === 'All'
        ? entries
        : entries.filter(e => (e.city || '') === selectedCityFilter);

      let totalUSD_val = 0;
      const byCat = {};
      filtered.forEach(e => {
        const usd = toUSD(e.amount, e.currency || 'EUR');
        totalUSD_val += usd;
        byCat[e.category] = (byCat[e.category] || 0) + usd;
      });
      totalUSDel.textContent = fmtMoney(totalUSD_val, 'USD');
      totalEURel.textContent = fmtMoney(totalUSD_val / EUR_TO_USD, 'EUR');

      byCategoryEl.innerHTML = '';
      Object.entries(byCat)
        .sort((a, b) => b[1] - a[1])
        .forEach(([cat, val]) => {
          const pill = document.createElement('div');
          pill.className = 'pill';
          pill.innerHTML = `${cat}: <b>${fmtMoney(val, 'USD')}</b>`;
          byCategoryEl.appendChild(pill);
        });

      buildCityFilters();

      const sorted = [...filtered].sort((a, b) => {
        const dateCompare = (b.date || '').localeCompare(a.date || '');
        if (dateCompare !== 0) return dateCompare;
        return (b.ts || 0) - (a.ts || 0);
      });

      listEl.innerHTML = '';
      if (sorted.length === 0) {
        listEl.innerHTML = '<div class="empty">No expenses logged yet for this view.</div>';
        return;
      }

      let lastDay = null;
      sorted.forEach(e => {
        const dateStr = e.date || new Date(e.ts || Date.now()).toISOString().slice(0, 10);
        const dateObj = new Date(dateStr + 'T12:00:00');
        const dayKey = dateObj.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
        if (dayKey !== lastDay) {
          const h = document.createElement('div');
          h.className = 'day-header';
          h.textContent = dayKey;
          listEl.appendChild(h);
          lastDay = dayKey;
        }
        const row = document.createElement('div');
        row.className = 'entry';
        const metaParts = [e.category || '', e.city || '', e.who || ''].filter(Boolean);
        row.innerHTML = `
          <div class="entry-main">
            <div class="entry-desc" data-id="${e.id}">${escapeHtml(e.description || '(no description)')}</div>
            <div class="entry-meta">${escapeHtml(metaParts.join(' \u00B7 '))}</div>
          </div>
          <div class="entry-amount">${fmtMoney(e.amount, e.currency || 'EUR')}</div>
          <button class="entry-del" title="Delete" data-id="${e.id}">&#10005;</button>
        `;
        listEl.appendChild(row);
      });

      listEl.querySelectorAll('.entry-del').forEach(btn => {
        btn.addEventListener('click', () => deleteEntry(btn.dataset.id));
      });
      listEl.querySelectorAll('.entry-desc').forEach(el => {
        el.addEventListener('click', () => openEditModal(el.dataset.id));
      });
    }

    async function deleteEntry(id) {
      try {
        await deleteDoc(doc(db, "expenses", id));
      } catch (err) {
        console.error('delete failed', err);
        alert('Could not delete \u2014 check your connection and try again.');
      }
    }

    // ---- Edit modal ----
    const editOverlay = document.getElementById('editOverlay');
    const editWhoButtons = document.querySelectorAll('#editWhoButtons button');
    let editingId = null;
    let editingWho = null;

    function openEditModal(id) {
      const entry = latestEntries.find(e => e.id === id);
      if (!entry) return;

      editingId = id;
      editingWho = entry.who || null;

      document.getElementById('editDesc').value = entry.description || '';
      document.getElementById('editCity').value = entry.city || 'Pre-Trip';
      document.getElementById('editDate').value = entry.date || '';
      document.getElementById('editCategory').value = entry.category || 'Other';
      document.getElementById('editCurrency').value = entry.currency || 'EUR';
      document.getElementById('editAmount').value = entry.amount != null ? entry.amount : '';

      editWhoButtons.forEach(b => b.classList.toggle('active', b.dataset.who === editingWho));

      editOverlay.style.display = 'flex';
    }

    function closeEditModal() {
      editOverlay.style.display = 'none';
      editingId = null;
    }

    editWhoButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        editingWho = btn.dataset.who;
        editWhoButtons.forEach(b => b.classList.toggle('active', b === btn));
      });
    });

    document.getElementById('editCloseBtn').addEventListener('click', closeEditModal);
    editOverlay.addEventListener('click', (ev) => {
      if (ev.target === editOverlay) closeEditModal();
    });

    document.getElementById('applyEditBtn').addEventListener('click', async () => {
      if (!editingId) return;

      const desc = document.getElementById('editDesc').value.trim();
      const city = document.getElementById('editCity').value;
      const entryDate = document.getElementById('editDate').value;
      const category = document.getElementById('editCategory').value;
      const currency = document.getElementById('editCurrency').value;
      const amount = parseFloat(document.getElementById('editAmount').value);

      if (!desc) { alert('Add a short description.'); return; }
      if (isNaN(amount) || amount <= 0) { alert('Enter a valid amount.'); return; }
      if (!entryDate) { alert('Pick a date.'); return; }

      try {
        await updateDoc(doc(db, "expenses", editingId), {
          description: desc,
          city,
          date: entryDate,
          category,
          currency,
          amount,
          who: editingWho || null
        });
      } catch (err) {
        console.error('update failed', err);
        alert('Could not save changes \u2014 check your connection and try again.');
        return;
      }

      closeEditModal();
    });

    const q = query(expensesCol, orderBy('ts', 'desc'), limit(1000));
    onSnapshot(q,
      (snap) => {
        statusEl.textContent = 'Synced \u2014 live';
        const entries = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        render(entries);
      },
      (err) => {
        console.error('snapshot error', err);
        statusEl.textContent = 'Connection issue \u2014 check your Firebase config and internet connection';
      }
    );

    let toastTimer = null;
    function showToast(msg) {
      const t = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      t.classList.remove('show');
      // force reflow so the checkmark animation restarts on repeated taps
      void t.offsetWidth;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
    }

    document.getElementById('addBtn').addEventListener('click', async () => {
      const desc = document.getElementById('desc').value.trim();
      const city = document.getElementById('city').value;
      const entryDate = document.getElementById('entryDate').value;
      const category = document.getElementById('category').value;
      const currency = document.getElementById('currency').value;
      const amountRaw = document.getElementById('amount').value;
      const amount = parseFloat(amountRaw);

      if (!desc) { alert('Add a short description.'); return; }
      if (isNaN(amount) || amount <= 0) { alert('Enter a valid amount.'); return; }
      if (!entryDate) { alert('Pick a date.'); return; }

      const entry = {
        description: desc,
        category,
        currency,
        amount,
        who: selectedWho || null,
        city,
        date: entryDate,
        ts: Date.now()
      };

      try {
        await addDoc(expensesCol, entry);
      } catch (err) {
        console.error('add failed', err);
        alert('Could not save \u2014 check your connection and try again.');
        return;
      }

      document.getElementById('desc').value = '';
      document.getElementById('amount').value = '';
      if (document.activeElement && document.activeElement.blur) {
        document.activeElement.blur();
      }
      showToast('Expense added');
    });
  </script>
</body>
</html>
